name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux jq flock

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux jq

      - name: Run unit tests
        run: bash scripts/run-tests.sh --tier unit

      - name: Write unit job summary
        if: always()
        run: |
          echo "## Unit Test Results (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/run-tests.sh --tier unit 2>/dev/null | grep "^unit\|^Total" >> "$GITHUB_STEP_SUMMARY" || true

  integration:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux jq flock

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux jq

      - name: Install ruflo and agentic-flow
        run: npm install -g ruflo agentic-flow

      - name: Run integration tests
        run: bash scripts/run-tests.sh --tier integration

      - name: Write integration job summary
        if: always()
        run: |
          echo "## Integration Test Results (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/run-tests.sh --tier integration 2>/dev/null | grep "^integration\|^Total" >> "$GITHUB_STEP_SUMMARY" || true

  e2e-mocked:
    name: E2E Tests (Mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux jq

      - name: Run mocked e2e tests (no secrets required)
        run: bash scripts/run-tests.sh --tier e2e

      - name: Write e2e-mocked job summary
        if: always()
        run: |
          echo "## E2E (Mocked) Test Results" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/run-tests.sh --tier e2e 2>/dev/null | grep "^e2e\|^Total" >> "$GITHUB_STEP_SUMMARY" || true

  e2e-real:
    name: E2E Tests (Real Claude)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on non-fork PRs when secrets are available and budget allows
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push'
      )
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check credentials and budget
        id: budget_check
        run: |
          # Check credentials
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" && -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "No Claude credentials found — skipping real e2e tests"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Budget stub: allow by default until cost ledger is wired
          # TODO: read cost ledger from SW_COSTS and compare against daily cap ($25)
          echo "Credentials present — proceeding with real e2e tests"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.budget_check.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.budget_check.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y tmux jq bubblewrap socat

      - name: Install Claude Code CLI
        if: steps.budget_check.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run real e2e tests
        if: steps.budget_check.outputs.skip != 'true'
        run: bash scripts/sw-integration-claude-test.sh

      - name: Annotate if skipped
        if: steps.budget_check.outputs.skip == 'true'
        run: |
          echo "::notice title=E2E Real Skipped::No Claude credentials or budget exhausted. Real e2e tests skipped."
          echo "## E2E Real Tests: Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "No Claude credentials present or budget cap reached." >> "$GITHUB_STEP_SUMMARY"

  # Fork PRs: visible annotation instead of silent skip
  # Maintainers apply 'safe-to-test-e2e' label to trigger real e2e on fork PRs
  e2e-fork-gate:
    name: E2E Fork Gate
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Annotate fork PR
        run: |
          echo "::notice title=E2E Tests Deferred::Fork PR detected. Real e2e tests require maintainer 'safe-to-test-e2e' label."
          echo "## Fork PR: E2E Tests Deferred" >> "$GITHUB_STEP_SUMMARY"
          echo "Apply the **safe-to-test-e2e** label to trigger real e2e tests on this PR." >> "$GITHUB_STEP_SUMMARY"

  # Validate integration-claude skip path when no secret (script must exit 0 and skip)
  integration-claude-skip:
    name: Claude Integration Skip Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integration-claude without secrets (expect skip)
        run: |
          out=$(bash scripts/sw-integration-claude-test.sh 2>&1) || exit 1
          echo "$out" | grep -q "Skipping integration-claude" || (echo "$out"; exit 1)
          echo "Skip path OK"

  dashboard-coverage:
    name: Dashboard Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard tests with coverage
        run: npx vitest run --config dashboard/vitest.config.ts --coverage

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint scripts
        run: |
          shellcheck -x -S error scripts/sw scripts/sw-*.sh install.sh
