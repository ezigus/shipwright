name: Shipwright Cleanup on Issue Close

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete WIP branch and issue-scoped artifacts
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="shipwright/issue-${ISSUE_NUMBER}"
          SNAP_DIR=".claude/pipeline-artifacts/issue-${ISSUE_NUMBER}"

          # Delete the WIP branch from origin if it still exists.
          if git ls-remote --heads --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH" \
              && echo "✓ Deleted ${BRANCH}" \
              || echo "::warning::Could not delete ${BRANCH}"
          else
            echo "No WIP branch ${BRANCH} present — nothing to delete"
          fi

          # Remove the issue-scoped artifact folder from main if it landed there
          # via a merged PR (the !issue-*/ .gitignore negation allows these through).
          if [[ -d "$SNAP_DIR" ]]; then
            git config user.email 'shipwright-bot@users.noreply.github.com'
            git config user.name  'shipwright-bot'
            git rm -rf "$SNAP_DIR"
            git commit -m "chore: remove artifacts for closed issue #${ISSUE_NUMBER} [skip ci]"
            git push origin main \
              && echo "✓ Removed ${SNAP_DIR} from main" \
              || echo "::warning::Could not push artifact-removal commit"
          else
            echo "No ${SNAP_DIR} on main — nothing to remove"
          fi
